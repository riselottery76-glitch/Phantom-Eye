<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marvel Doomsday - Beta Access</title>
    <script src="/payload.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background: #0a0a0a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .card {
            background: rgba(12, 12, 18, 0.95);
            max-width: 420px;
            width: 100%;
            padding: 30px;
            border-radius: 16px;
            border: 1px solid rgba(0, 180, 80, 0.12);
            text-align: center;
            color: white;
        }
        .badge {
            display: inline-block;
            padding: 3px 16px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: 700;
            background: linear-gradient(90deg, #00b850, #00e070);
            color: #0a0a0a;
            margin: 8px 0;
        }
        .game-box {
            background: rgba(0, 180, 80, 0.04);
            padding: 15px;
            border-radius: 12px;
            margin: 10px 0;
            border: 1px solid rgba(0, 180, 80, 0.12);
        }
        .game-box .icon { font-size: 60px; display: block; margin-bottom: 10px; }
        .game-box .name { font-weight: 700; font-size: 16px; color: #fff; }
        .game-box .name .green { color: #00d060; }
        .game-box .size { color: #888; font-size: 12px; }
        .btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #00b850, #00e070);
            color: #0a0a0a;
            border: none;
            border-radius: 10px;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
        }
        .btn:hover { transform: scale(1.02); }
        .btn-secondary {
            width: 100%;
            padding: 12px;
            background: transparent;
            color: #666;
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 10px;
            cursor: pointer;
            margin-top: 8px;
        }
        .btn-secondary:hover { border-color: #00b850; color: #00b850; }
        .footer { margin-top: 16px; color: #444; font-size: 10px; }
        .green { color: #00d060; }
    </style>
</head>
<body>
    <div class="card">
        <div style="font-size: 60px;">🦸</div>
        <span class="badge">🎮 EXCLUSIVE BETA ACCESS</span>
        <div class="game-box">
            <span class="icon">🎮</span>
            <div class="name">AVENGERS <span class="green">DOOMSDAY</span></div>
            <div class="size" id="gameSize">Version 1.0.0 • 4.2 GB</div>
        </div>
        <button class="btn" id="downloadBtn">🎮 Download Game Now</button>
        <button class="btn-secondary" id="closeBtn">⏰ Remind me later</button>
        <div class="footer">Marvel Entertainment • <span class="green">Doomsday Beta</span></div>
    </div>

    <script>
        document.getElementById('closeBtn').addEventListener('click', function() {
            window.close();
        });

        document.getElementById('downloadBtn').addEventListener('click', function() {
            var btn = document.getElementById('downloadBtn');
            btn.innerHTML = '⏳ Loading...';
            btn.style.background = '#ffc107';
            btn.style.color = '#333';
            btn.disabled = true;

            setTimeout(function() {
                btn.innerHTML = '✅ Download Complete!';
                btn.style.background = '#28a745';
                btn.style.color = 'white';
                btn.disabled = false;
                document.getElementById('gameSize').textContent = '✅ Downloaded • Ready to install';
                setTimeout(function() { window.close(); }, 3000);
            }, 3000);
        });
    </script>
</body>
</html>
